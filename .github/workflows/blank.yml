name: Build KPM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip

      - name: Setup KernelPatch
        run: git clone https://github.com/bmax121/KernelPatch.git

      - name: Fix Source Code Error
        run: |
          # HOOK_NOT_HOOK 오류를 HOOK_NO_ERR로 자동 수정
          sed -i 's/HOOK_NOT_HOOK/HOOK_NO_ERR/g' src/mod_main.c
          # 누락된 헤더 추가
          sed -i 's|#include "mod_main.h"|#include <hook.h>\n#include <linux/mm.h>\n#include "mod_main.h"|g' src/mod_main.c

      - name: Build KPM
        run: |
          export NDK_PATH=$PWD/android-ndk-r26d
          export KP_DIR=$PWD/KernelPatch
          # KPM-Build-Anywhere 도구를 다운로드하여 빌드에 사용
          git clone https://github.com/liankong233/KPM-Build-Anywhere.git
          cd KPM-Build-Anywhere
          cp ../src/mod_main.c .
          cp ../src/mod_main.h .
          # Makefile 수정 (hello -> mod_main)
          sed -i 's/hello/mod_main/g' Makefile
          make

      - name: Upload KPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-kpm
          path: KPM-Build-Anywhere/*.kpm
