name: Build KPM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
      - name: Setup KernelPatch
        run: git clone https://github.com/bmax121/KernelPatch.git
      - name: Build
        run: |
          export NDK_PATH=$PWD/android-ndk-r26d
          export KP_DIR=$PWD/KernelPatch
          # 여기에 실제 빌드 명령어(make 또는 build.sh)를 입력합니다.
          make
      - name: Upload KPM
        uses: actions/upload-artifact@v4
        with:
          name: feature-kpm
          path: "*.kpm"
